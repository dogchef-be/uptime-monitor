name: hung-requests-check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: hung-requests-check
  cancel-in-progress: false

jobs:
  hung-requests-check:
    name: hung page requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      NOTIFICATION_SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
      CLOUDFLARE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
      HUNG_REQUESTS_THRESHOLD: 10
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Check hung page requests
        run: scripts/hung-requests-check.sh
